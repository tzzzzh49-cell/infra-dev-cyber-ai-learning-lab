schema_version: 1
guide:
  active_manifest: curriculum/active.json
  active_version: "2.1.0"

# Ce fichier décrit ce qui existe aujourd'hui. Il n'accorde aucun crédit :
# chaque capacité devra être reconstruite, testée et expliquée au jour prévu.
status_values:
  mapped: tous les livrables cités dans l'entrée ont un candidat existant
  partial: certains candidats existent, mais le livrable du guide est incomplet
  placeholder_only: seule une préparation non activée existe
  missing: aucun candidat vérifié dans le dépôt
  archived_noncanonical: document historique conservé, interdit comme source créditable

mapping_contract:
  canonical_learning_source: curriculum/v2.1.0/Guide_370_jours_RNCP41996_Secure_AI_Ops_pas_a_pas.md
  current_paths_are_candidates_only: true
  formal_credit_requires_rebuild_and_explanation: true
  missing_items_are_not_inferred: true


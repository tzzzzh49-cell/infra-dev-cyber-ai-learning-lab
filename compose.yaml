name: infra-dev-cyber-ai-learning-lab

services:
  api:
    build:
      context: .
      dockerfile: app/Dockerfile
    image: infra-dev-cyber-ai-learning-lab-api:0.3.2
    container_name: infra-dev-cyber-ai-learning-lab-api
    # The image already switches to UID/GID 10001. Keeping the user here makes
    # the non-root runtime contract visible at Compose review time.
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      APP_ENV: ${APP_ENV:-lab}
      APP_LOG_FILE: ${APP_LOG_FILE:-/workspace/outputs/logs/app.log}
      DIAG_ACCESS_TOKEN_HASH: ${DIAG_ACCESS_TOKEN_HASH:-}
      DIAG_ACCESS_TOKEN_HASH_FILE: ${DIAG_ACCESS_TOKEN_HASH_FILE:-}
      DIAG_PROTECTION_DISABLED: ${DIAG_PROTECTION_DISABLED:-false}
      DIAG_COMMAND_TIMEOUT: ${DIAG_COMMAND_TIMEOUT:-3}
      DIAG_COMMAND_RETRIES: ${DIAG_COMMAND_RETRIES:-0}
    volumes:
      # Only reports and logs are writable. Raw data and backups stay outside
      # the application container.
      - ./outputs/reports:/workspace/outputs/reports:Z
      - ./outputs/logs:/workspace/outputs/logs:Z
    ports:
      # Local-first exposure. Use a protected reverse proxy before publishing
      # diagnostic routes outside 127.0.0.1.
      - "${APP_HOST:-127.0.0.1}:${APP_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  db:
    profiles:
      - future-persistence
    image: postgres:17.10-alpine3.24
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lab_reports}
      POSTGRES_USER: ${POSTGRES_USER:-lab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-placeholder-not-for-production}
    volumes:
      # Prepared for a future reports/index database. Migrations are not active
      # yet; introduce Alembic or an equivalent reviewed tool before use.
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  caddy:
    # Explicit opt-in: the default local lab must not bind public HTTP(S) ports.
    profiles:
      - public-proxy
    image: caddy:2.11.4-alpine
    container_name: lab-caddy
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  ai_reports:

name: CI

on:
  merge_group:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  check:
    name: Python ${{ matrix.python-version }} lint, compose config, tests and Bandit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - '3.12'
          - '3.13'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck ansible
          docker --version
          docker compose version

      - name: Install Python development dependencies
        run: python -m pip install -r app/requirements-dev.txt

      - name: Python lint
        run: make lint-python

      - name: ShellCheck
        run: make shellcheck

      - name: Docker Compose config
        run: make compose-config

      - name: Tests
        run: make test

      - name: FastAPI routes match OpenAPI
        run: make check-api-contract

      - name: Python security scan with Bandit
        run: python -m bandit -q -r app -x app/tests --severity-level medium --confidence-level medium

  secret-scan:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  hadolint:
    name: Hadolint Dockerfile
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Hadolint
        uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5 # v3.3.0
        with:
          dockerfile: app/Dockerfile

  trivy:
    name: Trivy image scan
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Build image for scan
        run: docker build -f app/Dockerfile -t infra-dev-cyber-ai-learning-lab-api:ci .

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: infra-dev-cyber-ai-learning-lab-api:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  dast:
    name: OWASP ZAP API scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install runtime dependencies
        run: python -m pip install -r app/requirements.txt

      - name: Scan the ephemeral local API
        run: |
          APP_ENV=test DIAG_PROTECTION_DISABLED=true \
            python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 \
            >/tmp/infra-lab-dast-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            curl -fsS http://127.0.0.1:8000/health >/dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/openapi.json >/dev/null
          docker run --rm --network host \
            --mount "type=bind,source=$PWD/.zap/rules.tsv,target=/zap/wrk/rules.tsv,readonly" \
            ghcr.io/zaproxy/zaproxy@sha256:461415b7526ca60af0ddc15389419d05df243aed1b665b64d3a8c3ebd67c6056 \
            zap-api-scan.py \
            -t http://127.0.0.1:8000/openapi.json \
            -f openapi -c /zap/wrk/rules.tsv -I -T 5 -s

  # check-full is intentionally not enabled by default because it is heavier
  # and may require a more complete runner environment. Run locally before merge:
  # make check-full

name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  check:
    name: Python ${{ matrix.python-version }} lint, compose config, tests and Bandit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - '3.12'
          - '3.13'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck ansible
          docker --version
          docker compose version

      - name: Install Python development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r app/requirements-dev.txt

      - name: Python lint
        run: make lint-python

      - name: ShellCheck
        run: make shellcheck

      - name: Docker Compose config
        run: make compose-config

      - name: Tests
        run: make test

      - name: Python security scan with Bandit
        run: python -m bandit -q -r app -x app/tests --severity-level medium --confidence-level medium

  hadolint:
    name: Hadolint Dockerfile
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Hadolint
        uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: app/Dockerfile

  trivy:
    name: Trivy image scan
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image for scan
        run: docker build -t infra-dev-cyber-ai-learning-lab-api:ci ./app

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: infra-dev-cyber-ai-learning-lab-api:ci
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  # check-full is intentionally not enabled by default because it is heavier
  # and may require a more complete runner environment. Run locally before merge:
  # make check-full

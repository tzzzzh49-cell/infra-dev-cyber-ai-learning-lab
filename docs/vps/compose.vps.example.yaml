# Exemple préparatoire pour VPS.
# Exemple valide depuis docs/vps/. Adapter les chemins si le fichier est copié ailleurs.
# Ne pas ajouter de secret dans ce fichier.

name: infra-dev-cyber-ai-learning-lab-vps

services:
  api:
    build:
      context: ../../app
    image: infra-dev-cyber-ai-learning-lab-api:v0.4.0-placeholder
    environment:
      APP_ENV: vps
      DIAG_ACCESS_TOKEN: ${DIAG_ACCESS_TOKEN:?set DIAG_ACCESS_TOKEN in a private .env.vps file}
    volumes:
      - ../../outputs:/workspace/outputs:Z
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    restart: unless-stopped

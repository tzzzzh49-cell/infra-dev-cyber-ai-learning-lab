# Exemple préparatoire pour VPS.
# Exemple valide depuis docs/vps/. Adapter les chemins si le fichier est copié ailleurs.
# Ne pas ajouter de secret dans ce fichier.

name: infra-dev-cyber-ai-learning-lab-vps

services:
  api:
    build:
      context: ../..
      dockerfile: app/Dockerfile
    image: infra-dev-cyber-ai-learning-lab:v0.4.0-placeholder
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      APP_ENV: vps
      APP_LOG_FILE: /workspace/outputs/logs/app.log
      DIAG_ACCESS_TOKEN_HASH: ${DIAG_ACCESS_TOKEN_HASH:?set DIAG_ACCESS_TOKEN_HASH from a secrets manager}
      DIAG_ACCESS_TOKEN_HASH_FILE: ${DIAG_ACCESS_TOKEN_HASH_FILE:-}
      DIAG_PROTECTION_DISABLED: "false"
    volumes:
      - ../../outputs/reports:/workspace/outputs/reports:Z
      - ../../outputs/logs:/workspace/outputs/logs:Z
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    restart: unless-stopped

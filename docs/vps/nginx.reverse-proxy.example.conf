# Exemple documentaire : la configuration chargée est nginx/default.conf.template.
# <LAB_DOMAIN> désigne le domaine public et <ADMIN_EMAIL> le contact ACME.
# Aucun certificat, clé privée ou secret OAuth2 n'est stocké dans le dépôt.

server {
    listen 80;
    server_name <LAB_DOMAIN>;
    return 301 https://$host$request_uri;
}

# Le serveur 443 actif ajoute : TLS public, mTLS vers FastAPI, OAuth2 sur
# /diag*, blocage de /docs, /redoc et /openapi.json, quotas 429 et OWASP CRS.
# Voir ../../nginx/default.conf.template et ../../compose.public.yaml.

# Exemple Nginx indicatif. Ne pas copier tel quel sans revue.
# Remplacer tous les placeholders hors dépôt et garder les secrets dans un gestionnaire dédié.

server {
    listen 443 ssl http2;
    server_name <LAB_DOMAIN>;

    ssl_certificate /etc/letsencrypt/live/<LAB_DOMAIN>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/<LAB_DOMAIN>/privkey.pem;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location = /diag {
        auth_basic "Diagnostics";
        auth_basic_user_file /etc/nginx/.htpasswd-lab;
        proxy_set_header X-Diag-Token "<DIAG_UPSTREAM_TOKEN_FROM_SECRET_MANAGER>";
        proxy_pass http://127.0.0.1:8000;
    }

    location = /diag/export/json {
        auth_basic "Diagnostics";
        auth_basic_user_file /etc/nginx/.htpasswd-lab;
        proxy_set_header X-Diag-Token "<DIAG_UPSTREAM_TOKEN_FROM_SECRET_MANAGER>";
        proxy_pass http://127.0.0.1:8000;
    }

    location = /diag/export/markdown {
        auth_basic "Diagnostics";
        auth_basic_user_file /etc/nginx/.htpasswd-lab;
        proxy_set_header X-Diag-Token "<DIAG_UPSTREAM_TOKEN_FROM_SECRET_MANAGER>";
        proxy_pass http://127.0.0.1:8000;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
    }
}

# Variante OAuth/OIDC :
# - placer oauth2-proxy ou le module d'authentification choisi devant les locations /diag ;
# - utiliser auth_request avant proxy_pass ;
# - injecter X-Diag-Token depuis un secret runtime, jamais depuis ce fichier commité.

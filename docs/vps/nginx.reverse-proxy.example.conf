# Exemple Nginx indicatif. Ne pas copier tel quel sans revue.
# Remplacer tous les placeholders hors dépôt et garder les secrets dans un gestionnaire dédié.

server {
    listen 443 ssl http2;
    server_name <LAB_DOMAIN>;

    ssl_certificate /etc/letsencrypt/live/<LAB_DOMAIN>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/<LAB_DOMAIN>/privkey.pem;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location /oauth2/ {
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_pass http://127.0.0.1:4180;
    }

    location /diag {
        add_header Cache-Control "no-store" always;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_pass http://127.0.0.1:4180;
    }

    location ~ ^/(docs|redoc|openapi\.json) {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
    }
}

# OAuth2 Proxy doit être configuré en Authorization Code + PKCE et transmettre
# l'ID token au backend. FastAPI revalide ensuite le JWT et applique le RBAC.

# Remove client-controlled identity and forwarding headers, then add trusted values.
proxy_set_header X-Diag-Token "";
proxy_set_header X-Authenticated-User "";
proxy_set_header X-Forwarded-Access-Token "";
proxy_set_header X-Forwarded-User "";
proxy_set_header X-Forwarded-Email "";
proxy_set_header X-Forwarded-Groups "";
proxy_set_header X-Forwarded-Preferred-Username "";
proxy_set_header X-Auth-Request-User "";
proxy_set_header X-Auth-Request-Email "";
proxy_set_header X-Auth-Request-Groups "";
proxy_set_header X-Auth-Request-Preferred-Username "";
proxy_set_header X-Auth-Request-Access-Token "";
proxy_set_header X-User "";
proxy_set_header X-Email "";
proxy_set_header Forwarded "";
proxy_set_header X-Forwarded-For "";
proxy_set_header X-Forwarded-Port "";
proxy_set_header X-Forwarded-Scheme "";
proxy_set_header X-Forwarded-Uri "";
proxy_set_header X-Real-IP "";
proxy_set_header X-Original-URL "";
proxy_set_header X-ProxyUser-IP "";
proxy_set_header CF-Connecting-IP "";
proxy_set_header X-Verified-Client-IP $remote_addr;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header Host $host;

proxy_ssl_certificate /run/mtls/nginx-client.crt;
proxy_ssl_certificate_key /run/mtls/nginx-client.key;
proxy_ssl_trusted_certificate /run/mtls/ca.crt;
proxy_ssl_verify on;
proxy_ssl_verify_depth 1;
proxy_ssl_server_name on;
proxy_ssl_name api;
proxy_ssl_protocols TLSv1.2 TLSv1.3;
